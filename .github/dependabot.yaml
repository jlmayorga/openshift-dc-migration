version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns:
          - k8s.io/api
          - k8s.io/apimachinery
          - k8s.io/client-go
      go-security:
        patterns:
          - golang.org/x/net
          - golang.org/x/text
          - golang.org/x/sys
          - golang.org/x/term
