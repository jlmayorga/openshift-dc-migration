name: Build candidates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod download && go mod verify
      - run: go test -mod=readonly -race ./... && go vet -mod=readonly ./...
      - run: |
          mkdir -p dist /tmp/security-tools
          go -C tools/security build -mod=readonly -o /tmp/security-tools/govulncheck golang.org/x/vuln/cmd/govulncheck
          go -C tools/security build -mod=readonly -o /tmp/security-tools/gosec github.com/securego/gosec/v2/cmd/gosec
          /tmp/security-tools/govulncheck -json ./... > dist/govulncheck.json
          python3 tools/check_vulnerabilities.py dist/govulncheck.json
          /tmp/security-tools/gosec -fmt=json -out=dist/gosec.json ./cmd/... ./internal/...
      - run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 tools/build_candidates.py --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidates
          path: dist/
