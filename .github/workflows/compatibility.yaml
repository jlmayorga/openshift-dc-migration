name: OpenShift qualification
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Candidate build run containing release-candidates
        required: true
        type: string
      platform:
        description: Native platform to execute (historical scope only)
        required: true
        type: choice
        options: [linux/amd64, darwin/arm64]
      minor:
        description: Explicit target minor
        required: true
        type: choice
        options: ['4.21']
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    environment: openshift-qualification
    runs-on: ${{ inputs.platform == 'darwin/arm64' && 'macos-14' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidates
          path: candidates
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - id: source
        run: |
          python3 - <<'PYCODE'
          import json,os,re
          revision=json.load(open('candidates/build-provenance.json'))['revision']
          if not re.fullmatch('[a-f0-9]{40}',revision):raise SystemExit('Invalid candidate revision')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('revision='+revision+'\n')
          PYCODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.revision }}
          clean: false
      - name: Validate and execute explicit native target
        env:
          TEST_KUBECONFIG: ${{ secrets.OPENSHIFT_TEST_KUBECONFIG }}
          TEST_TARGETS: ${{ secrets.OPENSHIFT_TEST_TARGETS_JSON }}
          TARGET_MINOR: ${{ inputs.minor }}
          TARGET_PLATFORM: ${{ inputs.platform }}
          TEST_IMAGE: ${{ vars.OPENSHIFT_TEST_IMAGE }}
          SECOND_TEST_IMAGE: ${{ vars.OPENSHIFT_SECOND_TEST_IMAGE }}
          QUALIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/dispatch_qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actual-openshift
          path: evidence/*.json
